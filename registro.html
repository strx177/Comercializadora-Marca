<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Crear cuenta</h1>
    <p class="subtitulo">Completa el formulario para registrarte.</p>

    <form action="#" method="post" id="formulario-registro" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
      </div>

      <div class="campo" id="campo-confirmar">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" autocomplete="new-password" required>
        <span class="mensaje-error">Las contraseñas no coinciden.</span>
      </div>

      <button type="submit" class="boton">Crear cuenta</button>
    </form>

    <p class="enlace-alterno">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </main>

  <script>
    const formulario = document.getElementById("formulario-registro");
    const clave = document.getElementById("clave");
    const confirmar = document.getElementById("confirmar");
    const campoConfirmar = document.getElementById("campo-confirmar");

    formulario.addEventListener("submit", function (e) {
      if (!formulario.checkValidity()) {
        e.preventDefault();
        formulario.reportValidity();
        return;
      }
      if (clave.value !== confirmar.value) {
        e.preventDefault();
        campoConfirmar.classList.add("invalido");
        confirmar.focus();
      }
    });

    confirmar.addEventListener("input", function () {
      campoConfirmar.classList.remove("invalido");
    });
  </script>
</body>
</html>
