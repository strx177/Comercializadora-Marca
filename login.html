<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Ingresa tus datos para continuar.</p>

    <form action="#" method="post">
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>

      <button type="submit" class="boton">Iniciar sesión</button>
    </form>

    <p class="enlace-alterno">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
  </main>
</body>
</html>
