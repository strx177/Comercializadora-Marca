<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="estilos_login_register.css">
</head>
<body>
  <main class="tarjeta">
    <div class="marca" aria-label="Comercializadora Marca">
      <span class="marca-icono" aria-hidden="true">M</span>
      <span class="marca-nombre"><span>COMERCIALIZADORA</span><strong>MARCA</strong></span>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Ingresa tus datos para continuar.</p>

    <form action="#" method="post" id="formulario-login">
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>

      <button type="submit" class="boton">Iniciar sesión</button>
    </form>

    <p class="enlace-alterno">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
  </main>
  <script>
    document.getElementById("formulario-login").addEventListener("submit", function (e) {
      e.preventDefault();
      window.location.href = "buscar_productos.html";
    });
  </script>
</body>
</html>
