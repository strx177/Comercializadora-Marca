{% extends "base.html" %}
{% block title %}Detalle de respaldo | Comercializadora Marca{% endblock %}
{% block content %}<section class="page-heading"><h1>{{ object.nombre|default:'Respaldo' }}</h1><a class="btn" href="/respaldos/{{ object.pk }}/editar/">Editar</a></section><section class="panel"><dl class="row"><dt class="col-md-3">Fecha</dt><dd class="col-md-9">{{ object.fecha|default:'-' }}</dd><dt class="col-md-3">Tamaño</dt><dd class="col-md-9">{{ object.tamano|default:'-' }}</dd></dl><a href="/respaldos/{{ object.pk }}/eliminar/">Eliminar respaldo</a></section>{% endblock %}
