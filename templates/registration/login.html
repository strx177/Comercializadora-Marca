{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion | Comercializadora Marca</title>
  <link rel="stylesheet" href="{% static 'estilos_login_register.css' %}">
</head>
<body>
  <main class="tarjeta">
    <div class="marca"><span class="marca-icono">M</span><span class="marca-nombre"><span>COMERCIALIZADORA</span><strong>MARCA</strong></span></div>
    <h1>Iniciar sesion</h1>
    <p class="subtitulo">Ingresa tus datos para continuar.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="boton">Iniciar sesion</button>
    </form>
    <p class="enlace-alterno">¿No tienes cuenta? <a href="/registro/">Crear cuenta</a></p>
  </main>
</body>
</html>
